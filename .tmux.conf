# --- 核心设置 (Core Settings) ---
# 前缀键改为 C-x (Emacs Style)
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# --- Emacs 兼容模式 ---
# 连按两次 C-x 将前缀发送给内部应用 (Emacs)
# 这样:
#   C-x 2 -> Tmux 分屏
#   C-x C-x s -> Emacs 保存文件
#   C-x C-x C-f -> Emacs 打开文件
bind C-x send-prefix


# 基础索引从1开始，方便手指触摸
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 鼠标支持 (调整大小时很有用)
set -g mouse on

# 减少 ESC 延迟 (对 Vim/Emacs 用户很重要)
set -sg escape-time 10

# --- 性能与体验优化 (Optimization) ---
set -s focus-events on      # 让 Neovim/Emacs 感知焦点变化 (autoread)
set -sg repeat-time 300     # 允许按键连发 (如调整大小时)
set -g detach-on-destroy off # 关闭最后一个窗口时不退出 Tmux，而是切换到其他 Session
set -g window-size largest
# setw -g aggressive-resize on  # 禁用：防止多client或历史client把zoom后的窗口锁在半屏宽度

# 增加历史记录
set -g history-limit 50000

# 256色与真彩支持
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# 更完善的终端特性声明（剪贴板、focus、真彩、扩展键）
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys,*256col*:RGB,screen*:title,rxvt*:ignorefkeys'

# 提示与 pane 编号显示时长延长，方便看清
set -g display-panes-time 2000
set -g display-time 2000

# 终端窗口标题同步 tmux 当前会话/窗口名
set -g set-titles on

# 5 分钟自动保存会话（默认 15 分钟）
set -g @continuum-save-interval '5'

# 恢复时保留常用 TUI 进程（lazygit/yazi/htop 等）
set -g @resurrect-processes 'lazygit yazi htop btop nvim emacs fish'

# --- 按键绑定 (Keybindings) ---
# 重载配置: Prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 分屏 (保留当前路径)
bind 2 split-window -v -c "#{pane_current_path}" # Emacs C-x 2
bind 3 split-window -h -c "#{pane_current_path}" # Emacs C-x 3
unbind '"'
unbind %

# 创建新窗口 (保留当前路径)
bind c new-window -c "#{pane_current_path}"

# 面板导航 (Emacs Style: C-n/p/f/b)
# 需要配合 Prefix 键使用，例如 C-x C-n
bind C-n select-pane -D
bind C-p select-pane -U
bind C-f select-pane -R
bind C-b select-pane -L

# 窗口切换
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-q display-panes
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- 高级功能 (Advanced) ---
# 切换多窗口同步输入 (Toggle Sync)
bind C-y set -w synchronize-panes \; display "Sync mode: #{?pane_synchronized,ON,OFF}"

# 移动当前窗口位置 (Move Window)
bind < swap-window -t -1 \; previous-window
bind > swap-window -t +1 \; next-window

# 快速调整面板大小 (Resize Panes) - Emacs Style (N/P/F/B)
bind -r B resize-pane -L 5
bind -r N resize-pane -D 5
bind -r P resize-pane -U 5
bind -r F resize-pane -R 5

# Alt+f: 一键放大/还原当前 pane (zoom)
bind -n M-f resize-pane -Z

# Pane 上下交换 (Prefix + > / <)
bind > swap-pane -D
bind < swap-pane -U

# --- 弹窗功能 (Popups) ---
bind C-z display-popup -E -b rounded -w 80% -h 80%
bind t   display-popup -E -b rounded -w 80% -h 80% -d "#{pane_current_path}"
bind h   display-popup -E -b rounded -w 80% -h 80% "btop"
bind g   display-popup -E -b rounded -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind d   display-popup -E -b rounded -w 90% -h 90% -d "#{pane_current_path}" "ranger"
bind y   display-popup -E -b rounded -w 90% -h 90% -d "#{pane_current_path}" "/snap/bin/yazi"
bind e   display-popup -E -b rounded -w 90% -h 90% -d "#{pane_current_path}" "nvim"
bind C   display-popup -E -b rounded -w 90% -h 90% "nvim ~/.tmux.conf"

# 将当前面板独立为新窗口 (Break Pane) / 重新拉回面板 (Join Pane)
bind ! break-pane -d \; swap-window -t -1 \; select-window -t +1
bind j command-prompt -p "Join pane from window:" "join-pane -s '%%'"
bind @ join-pane -s !

# --- 事件通知 (Activity Monitoring) ---
setw -g monitor-activity on
set -g visual-activity off  # 禁用中间的文字提示，仅保留状态栏高亮

# 移除之前的自动弹窗钩子 (恢复默认行为)
set-hook -u -g alert-activity

# 快速跳转快捷键
bind -n M-a next-window -a           # Alt + a: 跳到下一个活动窗口
bind -n M-Enter choose-tree -Zwf "#{window_activity_flag}" # Alt + Enter: 呼出活动窗口列表
bind a choose-tree -Zwf "#{window_activity_flag}"         # Prefix + a: 同样功能 (更标准)

# 复制模式 (Emacs Style)
setw -g mode-keys emacs
# 智能剪贴板适配 (Auto-detect Wayland/X11)
# 使用外部脚本处理环境检测 (copy_wrapper.sh)
bind -T copy-mode y send-keys -X copy-pipe-and-cancel "~/.tmux/copy_wrapper.sh"
bind -T copy-mode M-w send-keys -X copy-pipe-and-cancel "~/.tmux/copy_wrapper.sh"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.tmux/copy_wrapper.sh"

# Emacs copy-mode 下快速翻页
bind -T copy-mode C-u send-keys -N 5 -X scroll-up
bind -T copy-mode C-d send-keys -N 5 -X scroll-down

# 从系统剪贴板粘贴 (Prefix + ])
bind ] run-shell "~/.tmux/paste_wrapper.sh | tmux load-buffer - && tmux paste-buffer"

# --- 插件管理 (Plugins) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # 保存会话
set -g @plugin 'tmux-plugins/tmux-continuum'   # 自动保存
set -g @plugin 'tmux-plugins/tmux-cpu'         # CPU 状态
set -g @plugin 'tmux-plugins/tmux-battery'     # 电池状态
set -g @tmux-which-key-disable-autobuild 1    
set -g @plugin 'alexwforsythe/tmux-which-key' 
set -g @tmux-which-key-trigger ' '

# --- 界面色彩与状态栏 (Gruvbox 现代标签页风 - Modern Flat Tabs) ---

# 1. 基础颜色与排版
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left-length 100
set -g status-right-length 150
set -g status-justify left

# 2. 左侧：Session 徽章 (前缀键指示器)
# 平底矩形徽章，未按下时为浅蓝底 (#83a598)，按下时为醒目橙底 (#fe8019)
set -g status-left "#{?client_prefix,#[fg=#282828]#[bg=#fe8019]#[bold] ⌨ #S ,#[fg=#282828]#[bg=#83a598]#[bold] ❐ #S }#[bg=#1d2021]  "

# 3. 中间：现代独立标签页 (Flat Tabs)
setw -g automatic-rename-format "#(echo '#{pane_current_command}' | tr 'a-z' 'A-Z')"
set -g window-status-separator " "
# 普通标签：暗色平底矩形卡片
setw -g window-status-format "#[fg=#a89984,bg=#282828]  #I  #W  "
# 激活标签：Gruvbox 亮黄色高亮卡片，黑体粗字
setw -g window-status-current-format "#[fg=#282828,bg=#fabd2f,bold]  #I  #W  "
setw -g window-status-activity-style "fg=#fe8019,bg=#282828,bold"
setw -g window-status-bell-style "fg=#fb4934,bg=#282828,bold"

# 4. 右侧：系统状态徽章 (独立平底卡片)
set -g status-right ""
# CPU 模块
set -ag status-right "#[fg=#a89984,bg=#282828] CPU #{cpu_percentage} "
set -ag status-right " "
# 电池模块
set -ag status-right "#[fg=#a89984,bg=#282828] BAT #{battery_percentage} "
set -ag status-right " "
# 时间模块
set -ag status-right "#[fg=#282828,bg=#83a598,bold] %b %d日 %H:%M "

# 5. 提示信息与选择模式样式
set -g message-style "bg=#fabd2f,fg=#282828,bold"
set -g message-command-style "bg=#504945,fg=#ebdbb2"
set -g mode-style "bg=#504945,fg=#fabd2f,bold"

# 6. 插件功能配置
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# 恢复会话后及客户端接入/切换时，自动调整窗口自适应当前终端尺寸，防止小窗保存后大窗恢复出现点阵留白
# 自动自适应当前终端尺寸，窗口发生拉伸或放大(zoom)时确保100%填满屏幕，绝不只显示半屏
set -g @resurrect-hook-post-restore-all 'refresh-client -S'
set-hook -g client-attached 'refresh-client -S'
set-hook -g client-resized 'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'

# --- 面板边框美化 (Gruvbox Dark) ---
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"

# Popup 弹窗 Gruvbox 配色，和整体主题统一
set -g popup-style 'bg=#1d2021,fg=#ebdbb2'
set -g popup-border-style 'fg=#fabd2f'

# Pane 顶部状态栏，显示序号和当前目录，区分窗格更清晰
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#P:#{pane_current_command} (active),#P:#{pane_current_command}}'
# --- 终端透传 (Passthrough for Yazi) ---
set -g allow-passthrough on
# set -g extended-keys on
# set -g extended-keys-format csi-u

# 自动清理机制：关闭未命名的临时终端时自动销毁 session，避免后台堆积无用 session
set-hook -g client-detached 'run-shell "if [ \"#{session_name}\" -eq \"#{session_name}\" ] 2>/dev/null && [ \"#{session_attached}\" -eq 0 ]; then tmux kill-session -t \"#{session_name}\" 2>/dev/null; fi"'
# 3. 初始化 TPM (必须放在最后)
run '~/.tmux/plugins/tpm/tpm'

